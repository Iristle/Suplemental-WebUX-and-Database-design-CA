        <script>
            const Supabase_URL = "https://yabijlzbcwklpwprubrt.supabase.co";
            const Supabase_Anon_Key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhYmlqbHpiY3drbHB3cHJ1YnJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDc4MzksImV4cCI6MjEwMzcyMzgzOX0.FVi-qVZknv2iKHcyz8QZ-m1hMMxTqGB4zNd8pzesZfk";
            const supabaseClient = window.supabase.createClient(Supabase_URL, Supabase_Anon_Key);
                
            async function checkLogin() {
                const { data, error } = await supabaseClient.auth.getUser();

                if (error) {
                    if (error.name === "AuthSessionMissingError") {
                        window.location.replace("Project_Account.html");
                        return;
                    }
                };

                if (data.user) {
                    console.log("User is logged in!");
                };
            };
            
            const Loggout = document.getElementById("LogOut")

            async function LogOut() {
                const { error } = await supabaseClient.auth.signOut();
                if (error) {
                    console.error("Logout error:", error);
                return;
                };
                checkLogin();
            };

            const NewPassword = document.getElementById("pass");
            const ChangePass = document.getElementById("passChng");

            async function ChangePassword() {
                const newPassword = NewPassword.value;
                

                const { error } = await supabaseClient.auth.updateUser({password: newPassword});

                if (error) {
                    console.error("Password change error:", error);
                    return;
                };
            
                NewPassword.value = "";
            }

            const DeleteButton = document.getElementById("Delete");

            DeleteButton.addEventListener("click", async () => {
                const confirmed = confirm(
                    "Are you sure you want to permanently delete your account?"
                );

                if (!confirmed) {
                    return;
                }

                const { error } = await supabaseClient.functions.invoke("delete-account");

                if (error) {
                    console.error("Delete account error:", error);
                    alert("There was a problem deleting your account.");
                    return;
                }
                alert("Your account has been deleted.");
                await supabaseClient.auth.signOut();
                window.location.replace("Project_Account.html");
            });

            checkLogin();
            
            Loggout.addEventListener("click", LogOut);

            ChangePass.addEventListener("click", ChangePassword);

        </script>
